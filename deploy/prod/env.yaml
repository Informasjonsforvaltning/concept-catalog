---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concept-catalog
  labels:
    app: concept-catalog
spec:
  template:
    spec:
      containers:
        - name: concept-catalog
          env:
          - name: NAMESPACE
            valueFrom:
              secretKeyRef:
                name: common
                key: NAMESPACE
          - name: POSTGRESQL_HOST
            valueFrom:
              secretKeyRef:
                name: concept-catalog
                key: POSTGRESQL_HOST
          - name: POSTGRESQL_DB
            valueFrom:
              secretKeyRef:
                name: concept-catalog
                key: POSTGRESQL_DB
          - name: POSTGRESQL_USERNAME
            valueFrom:
              secretKeyRef:
                name: concept-catalog
                key: POSTGRESQL_USERNAME
          - name: POSTGRESQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: concept-catalog
                key: POSTGRESQL_PASSWORD
          - name: COLLECTION_BASE_URI
            valueFrom:
              secretKeyRef:
                name: commonurl
                key: CONCEPT_CATALOG_BASE_URI
          - name: KEYCLOAK_OIDC_ISSUER
            valueFrom:
              secretKeyRef:
                name: keycloak
                key: KEYCLOAK_OIDC_ISSUER
          - name: ADMIN_API_BASE_URI
            valueFrom:
              secretKeyRef:
                name: commonurl
                key: ADMIN_API_BASE_URI
          - name: CATALOG_HISTORY_SERVICE_URI
            valueFrom:
              secretKeyRef:
                name: commonurl
                key: CATALOG_HISTORY_SERVICE_HOST
          - name: CATALOG_ADMIN_SERVICE_URI
            valueFrom:
              secretKeyRef:
                name: commonurl
                key: CATALOG_ADMIN_SERVICE_BASE_URI
          - name: ELASTIC_KEYSTORE_PATH
            value: /var/secrets/elastic/keystores/keystore.jks
          - name: ELASTIC_KEYSTORE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: concept-catalog
                key: KEYSTORE_PASSWORD
          - name: ELASTIC_USERNAME
            valueFrom:
              secretKeyRef:
                name: es-user-concept-catalog
                key: username
          - name: ELASTIC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: es-user-concept-catalog
                key: password
          - name: ELASTIC_HOST
            valueFrom:
              secretKeyRef:
                name: elasticsearch-es
                key: ELASTIC_HOST
          - name: CORS_ORIGIN_PATTERNS
            value: https://*.fellesdatakatalog.digdir.no
